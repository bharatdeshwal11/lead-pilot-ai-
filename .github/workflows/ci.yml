name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: leadpilot_test
          POSTGRES_USER: leadpilot_ci
          POSTGRES_PASSWORD: disposable-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U leadpilot_ci -d leadpilot_test"
          --health-interval 5s --health-timeout 3s --health-retries 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: ./mvnw -B -ntp verify
        env:
          TEST_DB_URL: jdbc:postgresql://localhost:5432/leadpilot_test
          TEST_DB_USERNAME: leadpilot_ci
          TEST_DB_PASSWORD: disposable-ci-only

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  end-to-end:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cp .env.example .env && docker compose up --build --wait
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: frontend
      - run: set -a && source ../.env && set +a && npm run test:e2e
        working-directory: frontend
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v
